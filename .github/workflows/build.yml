name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rfd_version:
        description: "robotframework-dashboard Version"
        required: true
        default: "2.5.0"

env:
  RFD_VERSION: ${{ github.event.inputs.rfd_version || '2.5.0' }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/rf-dashboard-base

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image-Name in Kleinbuchstaben
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            RFD_VERSION=${{ env.RFD_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.RFD_VERSION }}
            ${{ env.IMAGE }}:latest
